<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Marketing Recipes</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-bold-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&amp;family=Libre+Caslon+Display&amp;display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f3f0e8;--ink:#11182a;--blue:#1453a0;--red:#d83024;--yellow:#f3d75c}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",Arial,sans-serif;padding:2rem 1.25rem}
    main{max-width:40rem}
    .marker{display:flex;align-items:center;gap:1rem;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;font-weight:600}
    .marker span:first-child{font:3rem/1 "Libre Caslon Display",Georgia,serif;padding-right:1rem;border-right:1px solid var(--blue)}
    h1{font:400 clamp(3rem,10vw,5.5rem)/.95 "Libre Caslon Display",Georgia,serif;letter-spacing:-.04em;margin:1.5rem 0 1rem}
    h1 em{font-style:normal;color:var(--blue)}
    p{font-size:1.1rem;margin:0 0 2rem}
    a{display:inline-flex;gap:2rem;justify-content:space-between;min-width:220px;padding:1rem 1.2rem;background:var(--yellow);color:#0d3e79;border:1px solid #0d3e79;text-decoration:none}
    a:focus-visible{outline:3px solid var(--red);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="marker"><span>404</span><span>Missing ingredient</span></div>
    <h1>This page isn’t <em>on the menu.</em></h1>
    <p>The link may be old or mistyped. Everything you need is on the homepage.</p>
    <a href="/">Back to the homepage <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
